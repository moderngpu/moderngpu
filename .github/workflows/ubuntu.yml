# Gunrock/Essentials Ubuntu Workflow
name: Ubuntu

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the master and dev branch
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that are executed as part of the job
    steps:
      # Fetch CUDA toolkit using Jimver/cuda-toolkit@master
      - name: Fetch CUDA toolkit
        uses: Jimver/cuda-toolkit@master
        id: cuda-toolkit
        with:
          cuda: '13.1.0'
          linux-local-args: '["--toolkit"]'

      # Verify the compiler before configuring CMake.
      - name: Check nvcc version
        run: nvcc -V

      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v6

      - name: Configure cmake
        # CUDA 13.1 no longer accepts the legacy SM 60 target used by the
        # project default. Keep the upstream CI architecture explicit while
        # leaving MODERNGPU_CUDA_ARCHITECTURES configurable for consumers.
        run: |
          cmake -B ${{github.workspace}}/build \
            -DMODERNGPU_CUDA_ARCHITECTURES=75

      - name: Build all applications
        # Build your program with the configuration selected above.
        run: cmake --build ${{github.workspace}}/build
