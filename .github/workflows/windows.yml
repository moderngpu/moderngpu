# ModernGPU Windows CUDA build workflow
name: Windows

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Fetch CUDA toolkit
        uses: Jimver/cuda-toolkit@master
        id: cuda-toolkit
        with:
          cuda: '13.1.0'

      - name: Check nvcc version
        run: nvcc -V

      - uses: actions/checkout@v6

      # CUDA 13.1 supports the Visual Studio 2022 host compiler. Initialize
      # the runner's VS2022 environment explicitly and use Ninja so CMake
      # does not perform Visual Studio CUDA-toolset discovery.
      - name: Configure and build with MSVC environment
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $vsPath = & $vswhere -latest -products * -property installationPath
          if (-not $vsPath) { throw 'Visual Studio installation not found' }
          $devCmd = Join-Path $vsPath 'Common7/Tools/VsDevCmd.bat'
          if (-not (Test-Path $devCmd)) { throw "VsDevCmd.bat not found: $devCmd" }

          cmd /c "`"$devCmd`" -arch=x64 && where cl && where link && cmake -S `"${{ github.workspace }}`" -B `"${{ github.workspace }}/build`" -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CUDA_COMPILER=`"%CUDA_PATH%\bin\nvcc.exe`" -DCMAKE_CUDA_HOST_COMPILER=cl.exe -DCMAKE_CUDA_ARCHITECTURES=75 -DMODERNGPU_CUDA_ARCHITECTURES=75 -DMODERNGPU_BUILD_DEMO=OFF -DMODERNGPU_BUILD_TUTORIAL=OFF -DMODERNGPU_BUILD_TESTS=ON && cmake --build `"${{ github.workspace }}/build`" --parallel"
